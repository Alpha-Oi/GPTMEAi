name: Bug report
description: Report a concrete, reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what went wrong. No secrets or private data.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands or actions.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, runtime version, relevant tool versions
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
